<!DOCTYPE html>
<html lang="en">
    <!-- By Ali Aslan -->
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="shortcut icon" type="x-icon" href="icon_foo_bmi.png">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="FoodCalorieFinder.css">
    <title>FOO Calorie Counter</title>
</head>
<body>
    
    <div class="container">
        <div class="box">
          <!-- <h1>FOO Calorie Counter</h1> -->
          <img src="h1.jpg" alt="" id="h1_img">
          <div class="content">

            <div class="foodContainer">

              <div id="h3_border">
                <h3>Food Calorie Finder</h3>
              </div>
              <label for="foodInput">Enter a food item:</label>
              <input type="text" id="foodInput" placeholder="e.g., 1 Apple">
              <button onclick="searchFood()">Search</button>
              <p id="calorieResult"></p>
          </div>
          
          <div id="h3_border">

            <h3 id="bmi_h3">BMI Calculator</h3>

          </div>

            <div class="input">
                <label for="height">Age</label>
                <input type="text" class="text-input" id="age" autocomplete="off" required/>
            </div>

            <div class="gender">

                <label class="container">
                    <input type="radio" name="radio" id="m"><p class="text">Male</p>
                    <span class="checkmark"></span>
                  </label>


                <label class="container">
                    <input type="radio" name="radio" id="f" ><p class="text">Female</p>
                      <span class="checkmark"></span>
                    </label>

            </div>

            <div class="containerHW">
            <div class="inputH">
              <label for="height">Height(cm)</label>
              <input type="number" id="height" required>
            </div>

            <div class="inputW">
              <label for="weight">Weight(kg)</label>
              <input type="number" id="weight" required>
            </div>
          </div>

            <button class="calculate" id="submit" onclick="calculate();">Calculate BMI</button>
          </div>
          <div class="result">
            <p>Your BMI is</p>
            <div id="result">00.00</div>
            <p class="comment"></p>
          </div>
          <div class="footer"><a class="footer-text" target="_blank" href="https://shamiislamkhan.netlify.app/">Nobo-Utthan ltd</a></div>
        
      

        </div>
      </div>
      
    <!-- The Modal -->
    <div id="myModal" class="modal">
      <!-- Modal content -->
    <div class="modal-content">
      <span class="close">&times;</span>
      <p id="modalText"></p>
    </div></div>



    
<script src="script.js"></script>
<script src="FoodCalorieFinder.js"></script>
<script defer src="https://app.fastbots.ai/embed.js" data-bot-id="clrees5vm22dgpxb3t9zhyykn"></script>

</body>
</html>
